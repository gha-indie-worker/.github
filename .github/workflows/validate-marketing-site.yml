name: Validate staged marketing site

on:
  pull_request:
    paths:
      - '.github/workflows/validate-marketing-site.yml'
      - 'marketing-site/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-marketing-site.yml'
      - 'marketing-site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: marketing-site
    env:
      npm_config_package_lock: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Validate the staged contract before dependency installation
        run: |
          set -euo pipefail
          node --check scripts/validate-site.mjs
          node scripts/validate-site.mjs \
            --json-output ../artifacts/marketing-site-contract.json

      - name: Install exact Astro and pinned browser test runtime
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Build the static Pages artifact
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          grep -Fq 'GHA Indie Worker — own the execution' dist/index.html
          grep -Fq 'build-server.v1' dist/index.html
          grep -Fq 'callers cannot inject command text' dist/index.html
          test -z "$(grep -R -n -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' dist || true)"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum \
            > ../artifacts/marketing-site.sha256

      - name: Run Chromium interaction and responsive tests
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:browser

      - name: Reject source whitespace and conflict markers
        working-directory: .
        run: |
          set -euo pipefail
          git diff --check
          if git grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- marketing-site; then
            echo 'git conflict marker detected' >&2
            exit 1
          fi

      - name: Publish static site and test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gha-indie-worker-marketing-site-${{ github.sha }}
          path: |
            marketing-site/dist
            marketing-site/playwright-report
            marketing-site/test-results
            artifacts/marketing-site-contract.json
            artifacts/marketing-site.sha256
          if-no-files-found: error
          retention-days: 30
