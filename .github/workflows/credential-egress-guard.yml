name: Credential egress guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-egress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Compile and test the redacting detector
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/credential_egress_guard.py \
            scripts/tests/test_credential_egress_guard.py
          python -m unittest scripts.tests.test_credential_egress_guard -v

      - name: Scan the complete tracked tree
        run: >-
          python scripts/credential_egress_guard.py
          --scope tracked
          --policy credential-egress-policy.json

      - name: Scan content introduced by the pull request
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/credential_egress_guard.py
          --scope introduced
          --base-ref "$BASE_REF"
          --policy credential-egress-policy.json
